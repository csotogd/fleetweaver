[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetweaver"
version = "0.1.0"
description = "A laptop-scale reproduction and generalization study of PARCO (NeurIPS 2025)"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = ["torch==2.7.0", "rl4co==0.5.2", "tensordict==0.7.2", "torchrl==0.7.2", "numpy>=1.26,<3", "matplotlib>=3.8", "pandas>=2", "scipy>=1.12", "ortools>=9.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["fleetweaver*", "parco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
